<!--******************************************************************************
 index.html -- March 2025 -- Joe Paradiso
 DETAILS:
  This file sets up the HTML skeleton for a clock that displays the current
  date, time, weather details, and a countdown timer. There is a navbar with 
  menu options for the user to select pre-defined themes or the user can 
  change the color of each individual element in the display.
******************************************************************************-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebClock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baumans&family=Chivo+Mono:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="text/javascript" src="themes.js" defer></script>
    <script type="text/javascript" src="weather.js" defer></script>
    <script type="text/javascript" src="clock.js" defer></script>
    <script type="text/javascript" src="sunTimes.js" defer></script>
    <script type="text/javascript" src="nextTrain.js" defer></script>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar" aria-label="Main Navigation">
      <button class="menu-toggle" id="mobile-menu" aria-label="Toggle navigation menu" aria-expanded="false" type="button">☰</button>
      <button class="nav-timer-link" id="open-timer-modal" type="button">＋ Create Timer</button>
      <ul class="nav-links">
        <li>
          <label for="themeSelector">General Themes:</label>
          <select id="themeSelector">
            <!-- options populated via JS -->
          </select>
        </li>
        <li>
          <label for="themeSelector2">Field Themes:</label>
          <select id="themeSelector2">
            <!-- options populated via JS -->
          </select>
        </li>
        <li>
          <label for="shadowColor">Box Shadow & Button Borders:</label>
          <input type="color" id="shadowColor" aria-label="Box Shadow & Button Borders" />
        </li>
        <li>
          <label for="clockBg1">Clock Background:</label>
          <input type="color" id="clockBg1" aria-label="Clock Background Color 1" />
          <input type="color" id="clockBg2" aria-label="Clock Background Color 2" />
        </li>
        <li>
          <label for="timerBg1">Timer Background:</label>
          <input type="color" id="timerBg1" aria-label="Timer Background Color 1" />
          <input type="color" id="timerBg2" aria-label="Timer Background Color 2" />
        </li>
        <li>
          <label for="buttonBg1">Button Background:</label>
          <input type="color" id="buttonBg1" aria-label="Button Background Color 1" />
          <input type="color" id="buttonBg2" aria-label="Button Background Color 2" />
        </li>
        <li>
          <label for="pageBg1">Page Background:</label>
          <input type="color" id="pageBg1" aria-label="Page Background Color 1" />
          <input type="color" id="pageBg2" aria-label="Page Background Color 2" />
        </li>
        <li>
          <label for="navbarColor">Navbar Background:</label>
          <input type="color" id="navbarColor" aria-label="Navbar Background Color" />
        </li>
        <li>
          <label for="textColor">Text Color:</label>
          <input type="color" id="textColor" aria-label="Text Color" />
        </li>
        <li>
          <label for="inputBoxColor">Input Box Color:</label>
          <input type="color" id="inputBoxColor" aria-label="Input Box Color" />
        </li>
      </ul>
    </nav>

    <div class="main-content">
      <!-- Main Content -->
      <div class="container">
        <main class="clock" aria-label="Digital Clock and Information Hub">
          <!-- Sunrise time, Date, Sunset time -->
          <div id="clockSunContainer">
            <div id="sunriseContainer">
              <div class="sun-block-label">Sunrise</div>
              <div id="sunrise">--:--</div>
            </div>
            <div id="Date">Loading Date...</div>
            <div id="sunsetContainer">
              <div class="sun-block-label">Sunset</div>
              <div id="sunset">--:--</div>
            </div>
          </div>
          <ul class="clock-display" aria-live="off">
            <li id="hours">00</li>
            <li class="point">:</li>
            <li id="minutes">00</li>
            <li class="point">:</li>
            <li id="seconds">00</li>
          </ul>
          <div id="trainContainer">
            <div id="departureContainer">
              <div id="departureTimeTxt">Departure at Dedham</div>
              <div id="departure-time">Loading...</div>
            </div>
            <div id="trainInfoContainer">
              <div id="trainRoute">Train/Route</div>
              <div id="train-route">Loading...</div>
            </div>
            <div id="arrivalContainer">
              <div id="arrivalTimeTxt">Arrival at South Station</div>
              <div id="arrival-time">Loading...</div>
            </div>
          </div>
          <!-- Weather Widget -->
          <div id="weather-widget">
            <div id="weather-info">
              <div id="current-temp">Loading weather...</div>
              <div id="feels-like"></div>
              <div id="high-low-temp"></div>
              <div id="sky-condition"></div>
              <div id="wind-speed"></div>
            </div>
          </div>
        </main>
      </div>

      <!-- Dynamic Multi-Timer Shelf -->
      <section id="timers-shelf" aria-label="Active Countdown Timers">
        <div id="timers-grid"></div>
      </section>
    </div>

    <!-- Create Timer Modal Overlay -->
    <div id="timer-modal-overlay" class="modal-overlay" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h2 id="modal-title">Create Countdown Timer</h2>
          <button type="button" class="modal-close-btn" id="close-timer-modal" aria-label="Close modal">✕</button>
        </div>
        <form id="create-timer-form">
          <div class="form-group">
            <label for="timer-label">Timer Label / Meeting Name</label>
            <input type="text" id="timer-label" placeholder="e.g., Sprint Planning, Client Sync, Lunch" maxlength="40" />
          </div>
          <div class="form-group">
            <label for="timer-note">Note / Description (Optional)</label>
            <input type="text" id="timer-note" placeholder="e.g., Bring updated datasheets, Conference Room B" maxlength="60" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="timer-date">Date</label>
              <input type="date" id="timer-date" required />
            </div>
            <div class="form-group">
              <label for="timer-time">Time</label>
              <input type="time" id="timer-time" required />
            </div>
          </div>
          <div class="quick-presets">
            <span class="preset-label">Quick Add:</span>
            <button type="button" class="preset-btn" data-minutes="15">+15m</button>
            <button type="button" class="preset-btn" data-minutes="30">+30m</button>
            <button type="button" class="preset-btn" data-minutes="45">+45m</button>
            <button type="button" class="preset-btn" data-minutes="60">+1h</button>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancel-timer-btn">Cancel</button>
            <button type="submit" class="btn-submit" id="submit-timer-btn">Start Timer</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
